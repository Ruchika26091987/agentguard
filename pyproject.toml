[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Async cache proxy and guardrail gateway for autonomous LLM tool executions."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "user", email = "user@example.com" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/agentguard --cov-report=term-missing --cov-fail-under=75"


[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF"]
ignore = [
    "E501",   # Ignore line length violations
    "B008",   # Do not perform function call `Depends` in argument defaults
    "FA100",  # Missing `from __future__ import annotations`
    "UP035",  # Deprecated typing imports
    "UP006",  # Non-pep585 type annotations
]

[tool.ruff.lint.isort]
known-first-party = ["agentguard"]


